name: check

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'media/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main signal. Evaluates the module tree without building. Uses the ci twin
  # because real hosts fail until hardware is generated
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Evaluate flake (no build)
        run: nix eval .#nixosConfigurations.ci.config.system.build.toplevel.drvPath

  # Style and hygiene. Separate so a formatting nit cannot hide the eval result
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Formatting (alejandra)
        run: nix run nixpkgs#alejandra -- --check .
      - name: Lint (statix)
        run: nix run nixpkgs#statix -- check .
      - name: Dead code (deadnix)
        run: nix run nixpkgs#deadnix -- --fail .

  # Builds the system. niri and noctalia come from their caches. Runs on main
  # and manual dispatch
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          # Pull niri and noctalia from their caches
          extra_nix_config: |
            extra-substituters = https://niri.cachix.org https://noctalia.cachix.org
            extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Build the NixOS system closure
        run: |
          nix build --print-build-logs \
            '.#nixosConfigurations.ci.config.system.build.toplevel'
